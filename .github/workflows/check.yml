name: Kiểm tra website
on:
  push:
    branches: [development]
  pull_request:
    branches: [development, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install preview check tools
        run: npm install --no-save --package-lock=false @astrojs/check@0.9.6 typescript@5.9.3 @types/node@24 playwright@1.56.1
      - run: npm exec -- astro check
      - run: npm exec -- playwright install --with-deps chromium
      - run: node scripts/verify-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: website-preview
          path: dist
          if-no-files-found: error

